<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cheer &amp; Chores</title>
<meta name="description" content="A cheer-themed chore and allowance tracker for the family.">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cheer &amp; Chores">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#fdf2ff; --bg2:#ffe4f3; --card:#ffffff; --ink:#2b1640; --ink2:#6b5880; --line:#ecdcf7;
  --pink:#ec4899; --purple:#7c3aed; --gold:#f59e0b; --green:#10b981; --red:#ef4444; --blue:#3b82f6;
  --shadow:0 6px 20px rgba(124,58,237,.12);
  --radius:20px;
  --okbg:#ecfdf5; --okline:#a7f3d0; --today:#f5edff; --goldbg:#fff7e6; --goldink:#92400e; --redbg:#fee2e2; --toast:#2b1640;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1026; --bg2:#2a1233; --card:#2b1d3a; --ink:#f5ecff; --ink2:#c4b2d8; --line:#43305a;
  --shadow:0 6px 20px rgba(0,0,0,.35); --okbg:#0f3326; --okline:#1f6b4f; --today:#3a2656; --goldbg:#3d2e12; --goldink:#fcd34d; --redbg:#4a1c22; --toast:#000;}}
:root[data-theme="dark"]{
  --bg:#1a1026; --bg2:#2a1233; --card:#2b1d3a; --ink:#f5ecff; --ink2:#c4b2d8; --line:#43305a;
  --shadow:0 6px 20px rgba(0,0,0,.35); --okbg:#0f3326; --okline:#1f6b4f; --today:#3a2656; --goldbg:#3d2e12; --goldink:#fcd34d; --redbg:#4a1c22; --toast:#000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.top h1{font-size:26px;margin:0;flex:1;letter-spacing:-.3px}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;
  background:var(--purple);color:#fff;font-weight:700;min-height:48px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}
.btn.red{background:var(--red)}.btn.ghost{background:var(--card);color:var(--purple);box-shadow:none;border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.grid{display:grid;gap:16px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.kid{position:relative;overflow:hidden;text-align:left;width:100%}
.kid .stripe{position:absolute;inset:0 0 auto 0;height:8px}
.kid .row{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;flex:none}
.kid h2{margin:0;font-size:24px}
.money{font-size:28px;font-weight:800}
.muted{color:var(--ink2)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;padding:12px 10px;border-radius:12px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.tabs button.on{background:var(--purple);color:#fff}
.chore{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line);width:100%;text-align:left;min-height:64px}
.chore .em{font-size:28px;width:40px;text-align:center}
.chore .nm{flex:1;font-weight:700;font-size:18px}
.chore .ck{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;color:#fff}
.chore.done{background:var(--okbg);border-color:var(--okline)}
.chore.done .nm{text-decoration:line-through;color:var(--ink2)}
.chore.done .ck{background:var(--green);border-color:var(--green)}
.week{width:100%;border-collapse:separate;border-spacing:4px;font-size:14px}
.week th{font-weight:700;color:var(--ink2);padding:4px}
.week th.today{color:var(--purple)}
.week td{text-align:center;background:var(--bg);border-radius:8px;height:34px}
.week td.today{outline:2px solid var(--purple);background:var(--today)}
.week td.name{text-align:left;background:none;padding-right:6px;white-space:nowrap}
.shopcat h3{margin:18px 0 8px;font-size:18px}
.item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.item .nm{flex:1;font-weight:600}
.price{font-weight:800;color:var(--purple)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg);font-size:12px;font-weight:700;color:var(--ink2);filter:grayscale(1);opacity:.5}
.badge.got{filter:none;opacity:1;background:var(--goldbg);color:var(--ink)}
.badge b{display:block;font-size:30px}
.list{display:flex;flex-direction:column;gap:8px}
.log{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plus{color:var(--green);font-weight:800}.minus{color:var(--red);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(43,22,64,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal .card{width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 10px}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field select{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:17px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin span{width:18px;height:18px;border-radius:50%;border:3px solid var(--purple)}
.pin span.f{background:var(--purple)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:16px;background:var(--bg);font-size:26px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast);color:#fff;
  padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw;text-align:center}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.hero{text-align:center;padding:30px 18px}
.hero .big{font-size:64px}
.edit-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.edit-row input{flex:1;min-width:0;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.edit-row input.em{flex:none;width:56px;text-align:center}
.edit-row input.num{flex:none;width:80px}
.x{width:38px;height:38px;border-radius:10px;background:var(--redbg);color:var(--red);font-weight:800;flex:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.streak{font-weight:800;color:var(--gold)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--goldbg);color:var(--goldink)}
.pill.due{background:var(--redbg);color:var(--red)}
h3{margin:0 0 10px}
.qrbox{background:#fff;padding:12px;border-radius:18px;width:min(300px,78vw);margin:6px auto 10px;box-shadow:var(--shadow)}
.qrbox svg{display:block;width:100%;height:auto}
.scan{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:1;width:min(320px,80vw);margin:6px auto 10px}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;inset:15%;border:4px solid #fff;border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}
ol.steps{margin:6px 0 10px;padding-left:22px;line-height:1.5}
</style>

<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ============================================================
   Cheer & Chores — family chore + allowance tracker
   All data lives on this device (localStorage). Export/Import
   in Parent > Settings makes a backup or moves data to a new iPad.
   ============================================================ */
const KEY = "cheerchores.v1";
const COLORS = ["#ec4899","#7c3aed","#3b82f6","#10b981","#f59e0b","#ef4444"];
const AVATARS = ["📣","⭐","🦄","🌈","🎀","🏆","⚡","🐬","🦋","🚀"];
const BADGES = [
  {at:10,em:"🥉",nm:"Bronze"},{at:20,em:"🥈",nm:"Silver"},{at:30,em:"🥇",nm:"Gold"},
  {at:40,em:"💎",nm:"Diamond"},{at:50,em:"👑",nm:"Champion"}];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const DEFAULT_CHORES = [
  ["🛏️","Make Bed"],["🪥","Brush Teeth AM"],["🌙","Brush Teeth PM"],["🧸","Put Away Toys"],
  ["🍽️","Help Set Table"],["🥣","Dishes in Sink"],["🧹","Pick Up Room"],["📚","Do Homework"],
  ["📖","Read 15 min"],["👕","Get Dressed"],["📣","Practice Cheer"],["🐾","Feed Pet"]];
const DEFAULT_REWARDS = [
  ["🍬 Wawa",[["1 candy",0.25],["2 candies",0.50],["3 candies",0.75]]],
  ["🎮 Roblox",[["30 min Roblox",0.25],["1 hr Roblox",0.50],["2 hr Roblox",1],["3 hr Roblox",1.50]]],
  ["📱 Screen time",[["30 min screen",0.25],["1 hr screen",0.50],["Movie",0.75]]],
  ["🎁 Games & toys",[["Small toy",1],["Medium toy",3],["Big toy",5]]],
  ["🍦 Treats",[["Ice cream",0.50],["Cookies",0.50],["Pizza night pick",0.50],["Dessert",0.50]]],
  ["🌙 Stay up late",[["Stay up 30 min",0.25],["Stay up 1 hr",0.50]]],
  ["👯 Activities",[["Target trip",5],["Playdate",2]]]];

/* ---------- utilities ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const uid = ()=>Math.random().toString(36).slice(2,10);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n=>(n<0?"-$":"$")+Math.abs(Math.round(n*100)/100).toFixed(2);
const r2 = n=>Math.round(n*100)/100;
function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekDays(d=new Date()){const s=weekStart(d);return [...Array(7)].map((_,i)=>addDays(s,i))}
async function sha(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("cc:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=0;for(const c of "cc:"+s)h=(h*31+c.charCodeAt(0))|0;return "h"+h; /* fallback when not on https */
}

/* ---------- state ---------- */
function fresh(){
  return {v:1,pinHash:null,kids:[],
    chores:DEFAULT_CHORES.map(([em,nm])=>({id:uid(),em,nm})),
    rewards:DEFAULT_REWARDS.map(([cat,items])=>({id:uid(),cat,items:items.map(([nm,price])=>({id:uid(),nm,price}))})),
    penalty:0.25, penaltyTime:"19:30", created:Date.now()};
}
function newKid(name,allowance,i){
  return {id:uid(),name,allowance:+allowance||0,color:COLORS[i%COLORS.length],avatar:AVATARS[i%AVATARS.length],
    balance:0,saved:0,goals:[],done:{},log:[],allowancePaidWeek:null,penaltyDays:{}};
}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||S.v!==1)S=fresh();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save on this device")}
  pushSync();
}
function kid(id){return S.kids.find(k=>k.id===id)}
let lastT=0;
function addLog(k,amt,what){const t=Math.max(Date.now(),lastT+1);lastT=t;k.log.unshift({t,amt:r2(amt),what})}
function doneOn(k,day){return k.done[day]||[]}
function isDone(k,choreId,day=dayKey()){return doneOn(k,day).includes(choreId)}
function streak(k){
  /* consecutive days (ending today, or yesterday if today isn't finished yet) with every chore done */
  const total=S.chores.length; if(!total)return 0;
  let d=new Date(),n=0;
  if(doneOn(k,dayKey(d)).filter(id=>S.chores.some(c=>c.id===id)).length<total)d=addDays(d,-1);
  while(doneOn(k,dayKey(d)).filter(id=>S.chores.some(c=>c.id===id)).length>=total){n++;d=addDays(d,-1)}
  return n;
}
function starsThisWeek(k){return weekDays().reduce((a,d)=>a+doneOn(k,dayKey(d)).length,0)}
function totalStars(k){return Object.values(k.done).reduce((a,v)=>a+v.length,0)}
function allowanceDue(k){return k.allowance>0&&k.allowancePaidWeek!==dayKey(weekStart())}
function pastPenaltyTime(){const [h,m]=S.penaltyTime.split(":").map(Number);const n=new Date();return n.getHours()*60+n.getMinutes()>=h*60+m}

/* ---------- family sync (optional) ----------
   Off until a parent turns it on in Parent > Settings > Family sync.
   When on, every change is turned into small field-level edits (syncOps) so two
   devices changing different things at the same time never overwrite each other:
   money uses increments, check-offs and history add or remove single entries.
   Data still lives in localStorage too, so the app opens instantly and offline. */
const SYNC_KEY="cheerchores.sync";
const FAMILY_FIELDS=["v","pinHash","chores","rewards","penalty","penaltyTime","created"];
let SY=null; /* {cfg:{apiKey,projectId,appId},fid} when this device belongs to a family */
const SYNC={mod:null,h:null,unsub:null,ready:false,base:null,state:"off",err:"",pending:false};
const clone=o=>JSON.parse(JSON.stringify(o));
function loadSyncCfg(){try{SY=JSON.parse(localStorage.getItem(SYNC_KEY))}catch(e){SY=null}if(!SY||!SY.fid||!SY.cfg)SY=null}
function storeSyncCfg(){try{SY?localStorage.setItem(SYNC_KEY,JSON.stringify(SY)):localStorage.removeItem(SYNC_KEY)}catch(e){}}
function loadSyncModule(){return window.__ccSyncModule?Promise.resolve(window.__ccSyncModule):import("./sync.js")}
function loadQrModule(){return window.__ccQrModule?Promise.resolve(window.__ccQrModule):import("./qr.js")}
/* iOS keeps a home-screen app's data apart from Safari's, so a link opened in Safari can't join the home-screen app. */
function isStandalone(){return !!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))}
function isIOS(){const n=navigator;return /iPad|iPhone|iPod/.test(n.userAgent||"")||(n.platform==="MacIntel"&&n.maxTouchPoints>1)}
const PENDING_KEY="cheerchores.pendingJoin";
function newFid(){const a="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",b=new Uint8Array(32);crypto.getRandomValues(b);return [...b].map(x=>a[x%62]).join("")}
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}
function joinCode(){return "CC1."+b64u(JSON.stringify({k:SY.cfg.apiKey,p:SY.cfg.projectId,a:SY.cfg.appId,f:SY.fid}))}
/* The address in the join QR code. The family code rides in the #fragment, which browsers never send to the web server. */
function joinUrl(){return new URL("./",location.href).href.split("#")[0]+"#join="+joinCode()}
/* Accepts a family join code, or the firebaseConfig block copied from the Firebase console. */
function parseSyncInput(txt){
  txt=String(txt||"").trim();
  const m=txt.match(/CC1\.([A-Za-z0-9_-]+)/);
  if(m){try{const j=JSON.parse(unb64u(m[1]));if(j.k&&j.p&&j.a&&/^[A-Za-z0-9]{24,64}$/.test(j.f))return {join:true,cfg:{apiKey:j.k,projectId:j.p,appId:j.a},fid:j.f}}catch(e){}return null}
  const cfg={};for(const f of ["apiKey","projectId","appId"]){const r=txt.match(new RegExp(f+`["']?\\s*:\\s*["']([^"']+)["']`));if(r)cfg[f]=r[1].trim()}
  return cfg.apiKey&&cfg.projectId&&cfg.appId?{join:false,cfg}:null;
}
function familyDoc(s){const f={};for(const k of FAMILY_FIELDS)if(s[k]!==undefined)f[k]=s[k];f.kidOrder=s.kids.map(k=>k.id);return f}
function kidData(k){const d=clone(k);delete d.id;return d}
/* What changed between two states, as Firestore edits. */
function syncOps(a,b){
  const J=JSON.stringify,ops={family:{},kidsSet:[],kidsDel:[],kidsUpd:[]};
  for(const f of FAMILY_FIELDS)if(J(a[f])!==J(b[f]))ops.family[f]=b[f]===undefined?null:b[f];
  const bo=b.kids.map(k=>k.id);if(J(a.kids.map(k=>k.id))!==J(bo))ops.family.kidOrder=bo;
  const am=new Map(a.kids.map(k=>[k.id,k])),bm=new Map(b.kids.map(k=>[k.id,k]));
  const lk=l=>l.t+"|"+l.what+"|"+l.amt;
  for(const k of b.kids){
    const o=am.get(k.id);if(!o){ops.kidsSet.push(clone(k));continue}
    const u=[];
    for(const f of new Set([...Object.keys(o),...Object.keys(k)])){
      if(f==="id")continue;const x=o[f],y=k[f];if(J(x)===J(y))continue;
      if(f==="balance"||f==="saved"){const d=r2((+y||0)-(+x||0));if(d)u.push([[f],{inc:d}])}
      else if(f==="done"&&y){const xs=x||{};for(const day of new Set([...Object.keys(xs),...Object.keys(y)])){
        const p=xs[day]||[],q=y[day]||[],add=q.filter(i=>!p.includes(i)),rem=p.filter(i=>!q.includes(i));
        if(add.length&&rem.length)u.push([["done",day],{set:q}]);else if(add.length)u.push([["done",day],{union:add}]);else if(rem.length)u.push([["done",day],{remove:rem}])}}
      else if(f==="penaltyDays"&&y){const xs=x||{};for(const day of new Set([...Object.keys(xs),...Object.keys(y)]))
        if(J(xs[day])!==J(y[day]))u.push([["penaltyDays",day],y[day]===undefined?{del:true}:{set:y[day]}])}
      else if(f==="log"&&y){const xk=new Set((x||[]).map(lk)),yk=new Set(y.map(lk));
        const add=y.filter(l=>!xk.has(lk(l))),rem=(x||[]).filter(l=>!yk.has(lk(l)));
        if(add.length&&rem.length)u.push([["log"],{set:y}]);else if(add.length)u.push([["log"],{union:add}]);else if(rem.length)u.push([["log"],{remove:rem}])}
      else u.push([[f],y===undefined?{del:true}:{set:y}]);
    }
    if(u.length)ops.kidsUpd.push({id:k.id,ops:u});
  }
  for(const k of a.kids)if(!bm.has(k.id))ops.kidsDel.push(k.id);
  return ops;
}
function opsEmpty(o){return !Object.keys(o.family).length&&!o.kidsSet.length&&!o.kidsDel.length&&!o.kidsUpd.length}
/* Family data from the server, as the app's state. */
function fromRemote(fam,kids){
  const s=fresh();for(const f of FAMILY_FIELDS)if(fam[f]!==undefined)s[f]=fam[f];s.v=1;
  const by=new Map(kids.map(k=>[k.id,k])),order=(fam.kidOrder||[]).filter(id=>by.has(id));
  for(const k of kids)if(!order.includes(k.id))order.push(k.id);
  s.kids=order.map((id,i)=>{const k=Object.assign({name:"Kid",allowance:0,color:COLORS[i%COLORS.length],avatar:AVATARS[i%AVATARS.length],
    balance:0,saved:0,goals:[],done:{},log:[],allowancePaidWeek:null,penaltyDays:{}},by.get(id));

function pushSync(){
  if(!SYNC.h||!SYNC.ready||!SYNC.base)return;

function onRemote(fam,kids){

  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

function syncStatus(st){
  if(st.error){SYNC.state="error";SYNC.err=st.error}
  else{SYNC.state=st.pending?(navigator.onLine===false||st.fromCache?"offline":"saving"):st.fromCache?"offline":"synced";SYNC.err=""}
  const p=$("#syncpill");if(p)p.outerHTML=syncPill();
}
function syncPill(){
  if(!SY)return `<span id="syncpill"></span>`;

  return `<span id="syncpill" class="pill ${SYNC.state==="error"?"due":""}">${t}</span>`;
}
function syncErrText(code){
  code=String(code||"");
  if(/permission/i.test(code))return "Firebase said no. Check that the security rules from the setup steps are published.";
  if(/missing/.test(code))return "This family isn't in Firebase anymore. Disconnect this device and join again.";
  if(/not-found|failed-precondition|NOT_FOUND/i.test(code))return "Firebase has no database yet. Create the Firestore database (setup step 3).";
  if(/timeout|unavailable|network/i.test(code))return "Couldn't reach Firebase. Check the internet connection and try again.";
  if(/api.?key|invalid-argument/i.test(code))return "Firebase didn't accept that setup code. Copy it again from the Firebase console.";

}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))])}
async function startSync(){

    if(S.kids.length){SYNC.base=clone(S);SYNC.ready=true}

  }catch(e){syncStatus({error:e&&(e.code||e.message)});render()}
}
async function stopSync(){

/* Make this device's data the family's data and start syncing. */
async function createFamily(cfg){
  const fid=newFid(),mod=await loadSyncModule(),h=mod.open(cfg,fid,Object.assign({},window.__ccSyncOpts,{temp:true}));
  try{await withTimeout(mod.upload(h,familyDoc(S),S.kids.map(k=>({id:k.id,data:kidData(k)}))),20000)}
  catch(e){await mod.close(h);throw e}
  await mod.close(h);

/* Join an existing family; this device's data is replaced by the family's. */
async function joinFamily(p){
  const mod=await loadSyncModule(),h=mod.open(p.cfg,p.fid,Object.assign({},window.__ccSyncOpts,{temp:true}));
  let ok;try{ok=await withTimeout(mod.exists(h),20000)}finally{await mod.close(h)}
  if(!ok)throw {code:"missing"};
  await stopSync();SY={cfg:p.cfg,fid:p.fid};storeSyncCfg();
  S=fresh();S.kids=[];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

function handleJoinLink(){
  const h=location.hash||"";
  if(/^#join=/.test(h)){
    try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
    let code="";try{code=decodeURIComponent(h.slice(6))}catch(e){}
    const p=parseSyncInput(code);
    if(!p||!p.join){toast("That join link didn't come through. Show the QR code again.");return}
    if(SY&&SY.fid===p.fid){toast("This device is already in your family ✅");return}
    if(isIOS()&&!isStandalone()){
      try{localStorage.setItem(PENDING_KEY,JSON.stringify({code:code.match(/CC1\.[A-Za-z0-9_-]+/)[0],t:Date.now()}))}catch(e){}
      openModal({html:()=>`<h2>📲 Almost there</h2><p>This opened in Safari. The Cheer &amp; Chores app on the Home Screen keeps its own data, so join from there:</p>

        bind(m){m.querySelector("[data-close]").onclick=closeModal}});
      return}
    offerJoin(p,{link:true});return}
  if(isStandalone()&&!SY){let j=null;try{j=JSON.parse(localStorage.getItem(PENDING_KEY));localStorage.removeItem(PENDING_KEY)}catch(e){}
    if(j&&Date.now()-j.t<864e5){const p=parseSyncInput(j.code);if(p&&p.join)offerJoin(p,{link:true})}}
}

/* ---------- confetti ---------- */
function confetti(){
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const P=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:6+Math.random()*6,c:COLORS[Math.random()*6|0],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
let toastT;function toast(msg){let t=$(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

    bind(m){setTimeout(()=>m.querySelector("#amt").focus(),50);m.querySelector("[data-close]").onclick=closeModal;
      m.querySelector("[data-ok]").onclick=()=>{const a=r2(parseFloat(m.querySelector("#amt").value));
        if(!(a>0)){toast("Enter an amount");return}if(max!=null&&a>max+1e-9){toast("That's more than "+money(max));return}

      bind(m){
        let stream=null,timer=0,done=false;
        const stop=()=>{done=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};

  async shareJoin(){
    if(!SY)return;const code=joinCode();
    openModal({html:()=>`<h2>Your family code</h2><p class="muted">On each iPad or phone: open Cheer &amp; Chores from its home-screen icon, tap “Join my family”, and paste this. Only share it with your own family.</p>
      <textarea readonly rows="5" style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:13px ui-monospace,Menlo,monospace;color:var(--ink);-webkit-user-select:all;user-select:all">${esc(code)}</textarea>
      <div class="row2" style="margin-top:12px"><button class="btn ghost" data-close>Done</button><span class="spacer"></span><button class="btn" data-copy>📋 Copy</button>${navigator.share?`<button class="btn pink" data-share>Share…</button>`:""}</div>`,
      bind(m){m.querySelector("[data-close]").onclick=closeModal;
        m.querySelector("[data-copy]").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("Copied")}catch(e){const t=m.querySelector("textarea");t.focus();t.select();toast("Select the code and tap Copy")}};
        const sh=m.querySelector("[data-share]");if(sh)sh.onclick=async()=>{try{await navigator.share({text:code})}catch(e){}}}})},
  syncOff(){
    if(!SY)return;
    openModal({html:()=>`<h2>Disconnect this device?</h2><p>This device stops syncing and keeps its own copy. Your family's data on other devices isn't touched. You can join again with the family code.</p><div class="row2"><button class="btn ghost" data-close>Cancel</button><span class="spacer"></span><button class="btn red" data-ok>Disconnect</button></div>`,
      bind(m){m.querySelector("[data-close]").onclick=closeModal;m.querySelector("[data-ok]").onclick=async()=>{await stopSync();SY=null;storeSyncCfg();if(!S.kids.length)S=fresh();save();closeModal();V.parent=false;go({screen:"home"});toast("Disconnected")}}})},
  async finishSetup(){
    const rows=setupRows.map(r=>({name:r.name.trim(),allowance:r2(parseFloat(r.allowance)||0)})).filter(r=>r.name);
    if(!rows.length){toast("Add at least one name");return}
    const pin=$("#setupPin").value.trim();if(!/^\d{4}$/.test(pin)){toast("Pick a 4-digit parent PIN");return}
    S.kids=rows.map((r,i)=>newKid(r.name,r.allowance,i));S.pinHash=await sha(pin);save();confetti();render();
  }
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||!actions[el.dataset.act])return;actions[el.dataset.act](el)});
/* settings edits save on change */
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(!(V.screen==="parent"&&V.parent))return;
  if(d.kf){const k=kid(d.id);if(!k)return;k[d.kf]=d.kf==="allowance"?r2(parseFloat(t.value)||0):(t.value.trim()||k[d.kf])}
  else if(d.cf){S.chores[+d.i][d.cf]=t.value.trim()||S.chores[+d.i][d.cf]}
  else if(d.catf){S.rewards[+d.ci].cat=t.value.trim()||S.rewards[+d.ci].cat}
  else if(d.itf){const it=S.rewards[+d.ci].items[+d.ii];it[d.itf]=d.itf==="price"?r2(parseFloat(t.value)||0):(t.value.trim()||it.nm)}
  else if(t.id==="setPenalty"){S.penalty=r2(parseFloat(t.value)||0)}
  else if(t.id==="setTime"){if(/^\d\d:\d\d$/.test(t.value))S.penaltyTime=t.value}
  else return;save();render()});
/* refresh when the app comes back to the foreground (new day, new week) */
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(!SY)load();if(V.screen==="parent")V.parent=false,V.screen="home";render()}});

load();loadSyncCfg();render();startSync();handleJoinLink();
setTimeout(()=>{if(SY&&SYNC.state==="connecting")syncStatus({fromCache:true})},10000);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ask the browser to keep our data even when storage is tight */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
